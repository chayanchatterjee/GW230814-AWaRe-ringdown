; -----------------------------------------------------------------------------
; DECLARE ARGUMENTS
; -----------------------------------------------------------------------------

[variable_params]
mass1 =
mass2 =
#spin1z =
#spin2z =
spin1_a =
spin1_azimuthal =
spin1_polar =
spin2_a =
spin2_azimuthal =
spin2_polar =
t_shift =
ra =
dec =
#chirp_distance =
#distance = 
coa_phase =
inclination =
injection_snr =
polarization =


[static_params]
approximant = SEOBNRv5PHM
domain = time
f_lower = 20
distance = 100
waveform_length = 128
noise_interval_width = 16
original_sampling_rate = 16384
target_sampling_rate = 4096
whitening_segment_duration = 4
whitening_max_filter_duration = 4
bandpass_lower = 20
bandpass_upper = 512
seconds_before_event = 0.8
seconds_after_event = 0.2
tukey_alpha = 0.25

#; Optional: sample a single deviation value per injected template and apply
#; it to modes selected at runtime (see README command example).
domega_range = -0.20, 0.20
dtau_range = -0.10, 0.10



; -----------------------------------------------------------------------------
; DEFINE DISTRIBUTIONS FOR PARAMETERS
; -----------------------------------------------------------------------------

; Sample intrinsic parameters directly from a posterior HDF file.
; Update `filename` and `dataset` to match your local posterior file format.
; -----------------------------------------------------------------------------
; DEFINE DISTRIBUTIONS FOR PARAMETERS
; -----------------------------------------------------------------------------

[prior-mass1]
; Prior for mass1
name = uniform
#filename = params_49.hdf
min-mass1 = 30.0
max-mass1 = 50.0


[prior-mass2]
; Prior for mass2
name = uniform
#filename = params_49.hdf
min-mass2 = 30.0
max-mass2 = 50.0


#[prior-spin1z]
#; Prior for spin1z
#name = uniform
#min-spin1z = -0.998
#max-spin1z = 0.998


#[prior-spin2z]
#; Prior for spin2z
#name = uniform
#min-spin2z = -0.998
#max-spin2z = 0.998

[prior-spin1_a]
name = uniform
min-spin1_a = 0.0
max-spin1_a = 0.99

[prior-spin1_polar+spin1_azimuthal]
name = uniform_solidangle
polar-angle = spin1_polar
azimuthal-angle = spin1_azimuthal

[prior-spin2_a]
name = uniform
min-spin2_a = 0.0
max-spin2_a = 0.99

[prior-spin2_polar+spin2_azimuthal]
name = uniform_solidangle
polar-angle = spin2_polar
azimuthal-angle = spin2_azimuthal

#[waveform_transforms-spin1x+spin1y+spin1z]
#name = spherical_to_cartesian
#x = spin1x
#y = spin1y
#z = spin1z
#radial = spin1_a
#polar = spin1_polar
#azimuthal = spin1_azimuthal

#[waveform_transforms-spin2x+spin2y+spin2z]
#name = spherical_to_cartesian
#x = spin2x
#y = spin2y
#z = spin2z
#radial = spin2_a
#polar = spin2_polar
#azimuthal = spin2_azimuthal


[prior-t_shift]
name = uniform
min-t_shift = -0.1
max-t_shift = 0.1

#[prior-distance]
#; Prior for distance
#name = uniform
##filename = params_38.hdf
#min-distance = 4
#max-distance = 1000


[prior-injection_snr]
; Prior for the injection SNR
name = uniform
#filename = snr_49.hdf
min-injection_snr = 42.0
max-injection_snr = 43.0


[prior-coa_phase]
; Coalescence phase prior
name = uniform_angle


[prior-inclination]
#; Inclination prior
name = sin_angle
#name = uniform
#min-inclination = 0.39269908169
#max-inclination = 0.98174770424

#[prior-ra+dec]
#; Sky position prior
#name = uniform_sky

[prior-ra]
;Prior for u (RA)
name =  uniform
min-ra = 0
max-ra = 1

[prior-dec]
;Prior for v (Dec)
name = uniform
min-dec = 0
max-dec = 1

[prior-polarization]
; Polarization prior
name = uniform_angle

[constraint-1]
name = custom
constraint_arg = mass2 <= mass1

#[constraint-2]
#name = custom
#constraint_arg = mchirp_from_mass1_mass2(mass1, mass2) >= 10

#[constraint-3]
#name = custom
#constraint_arg = mchirp_from_mass1_mass2(mass1, mass2) <= 20

